<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowLens — Bottleneck Report</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand"><div class="logo"></div><span>FlowLens</span></div>
    <nav>
      <a href="dashboard.html">Home</a>
      <a href="upload.html">Upload</a>
    </nav>
    <div class="user">
      <span id="userName"></span>
      <button onclick="logout()">Log out</button>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <h2 id="datasetTitle">Bottleneck Report</h2>
        <div>
          <button class="secondary" id="runBtn" onclick="runAnalysis()">Re-run analysis</button>
          <button class="primary" id="pdfBtn" onclick="downloadPdf()" style="width:auto; margin-top:0;">Download PDF</button>
        </div>
      </div>
      <p class="muted" id="statusLine"></p>
    </div>

    <div id="content"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/report.js"></script>
</body>
</html>
